name: build-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: 3.47.7
      GRADLE_VERSION: 9.3.1
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@v4

      - name: Apply root patch
        run: |
          set -e
          unzip -q -o dsh-go-root-patch.zip -d /tmp/patchsrc
          cp -rv /tmp/patchsrc/dsh-go-root-patch/files/. .
          echo --- changed files ---
          git status --short

      - name: Stage runtime from upstream APK
        run: |
          set -e
          URL=https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.1.0/dsh-go-1.1.0-arm64.apk
          curl -fL --retry 3 -o /tmp/upstream.apk "$URL"
          ls -lh /tmp/upstream.apk
          mkdir -p /tmp/oapk
          unzip -q /tmp/upstream.apk -d /tmp/oapk
          echo "--- top of APK ---"
          ls /tmp/oapk
          echo "--- assets ---"
          ls -la /tmp/oapk/assets 2>/dev/null | head -30 || true
          echo "--- assets/runtime ---"
          ls -la /tmp/oapk/assets/runtime 2>/dev/null | head -30 || true
          echo "--- lib/arm64-v8a ---"
          ls -la /tmp/oapk/lib/arm64-v8a 2>/dev/null | head -40 || true
          mkdir -p runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          if [ -d /tmp/oapk/assets/runtime ]; then
            cp -a /tmp/oapk/assets/runtime runtime/out/arm64-v8a/assets/
          else
            echo "::error::assets/runtime not found in upstream APK"; exit 1
          fi
          for f in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            if [ -f /tmp/oapk/lib/arm64-v8a/$f ]; then
              cp -v /tmp/oapk/lib/arm64-v8a/$f runtime/out/arm64-v8a/jniLibs/arm64-v8a/
            fi
          done
          echo "--- staged runtime ---"
          find runtime/out -maxdepth 4 -type f -printf '%10s  %p\n' | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build release APK (flavor arm64)
        working-directory: app
        run: flutter build apk --release --flavor arm64

      - name: Locate APK
        run: |
          echo "--- candidates ---"
          find app/build/app/outputs -name '*.apk' -printf '%10s  %p\n' || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-apk
          path: app/build/app/outputs/**/*.apk
          if-no-files-found: error
