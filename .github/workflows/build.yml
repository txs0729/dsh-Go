name: build-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: 3.47.7
      GRADLE_VERSION: 9.3.1
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@v4

      - name: Apply root patch
        run: |
          set -e
          unzip -q -o dsh-go-root-patch.zip -d /tmp/patchsrc
          cp -rv /tmp/patchsrc/dsh-go-root-patch/files/. .
          echo --- changed files ---
          git status --short

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Pub get and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
